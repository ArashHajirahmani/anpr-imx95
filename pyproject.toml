[project]
name = "anpr"
version = "0.1.0"
description = "Automatic number plate recognition service for the i.MX95 Neutron NPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
anpr = "anpr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anpr = ["static/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools/host"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["anpr", "export_int8", "onnx_split_head"]
