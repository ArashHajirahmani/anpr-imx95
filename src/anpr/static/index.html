<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ANPR</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #10140f;
    color: #e7f0e4;
    font-family: "DejaVu Sans", sans-serif;
  }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100vh;
    height: 100dvh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.3rem 0.55rem 0.15rem;
    flex: 0 0 auto;
  }
  h1 {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  #status { margin: 0; font-size: 0.75rem; }
  #status.ok { color: #39ff14; }
  #status.wait { color: #d7e0d4; }
  #status.down { color: #ffb020; }
  #error {
    margin: 0 0.55rem;
    color: #ffb020;
    font-size: 0.75rem;
  }
  #error:empty { display: none; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(9.5rem, 18vw);
    gap: 0.45rem;
    padding: 0.2rem 0.55rem 0.35rem;
    min-height: 0;
    min-width: 0;
  }
  .live {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .frame {
    position: relative;
    background: #0a0c0a;
    overflow: hidden;
    min-height: 0;
  }
  .live .frame {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .live .frame img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .boxes { position: absolute; inset: 0; pointer-events: none; }
  .box {
    position: absolute;
    border: 3px solid #39ff14;
    box-sizing: border-box;
  }
  .box-label {
    position: absolute;
    left: 50%;
    top: calc(100% + 0.2rem);
    transform: translateX(-50%);
    margin: 0;
    color: #39ff14;
    font-family: "DejaVu Sans Mono", monospace;
    font-size: clamp(0.95rem, 1.8vw, 1.45rem);
    letter-spacing: 0.08em;
    text-shadow: 0 0 2px #000, 0 1px 2px #000, 1px 0 2px #000;
    white-space: nowrap;
    pointer-events: none;
  }
  .meta-overlay {
    position: absolute;
    left: 0.55rem;
    top: 0.45rem;
    margin: 0;
    padding: 0.35rem 0.5rem;
    color: #39ff14;
    font-family: "DejaVu Sans Mono", monospace;
    font-size: clamp(0.68rem, 1.05vw, 0.88rem);
    line-height: 1.4;
    letter-spacing: 0.02em;
    text-shadow: 0 0 2px #000, 0 1px 2px #000, 1px 0 2px #000;
    background: rgba(0, 0, 0, 0.45);
    pointer-events: none;
    white-space: pre;
  }
  .meta-overlay.hidden { display: none; }
  .history {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-height: 0;
    min-width: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #3a4638 transparent;
  }
  .history article {
    background: #181c17;
    padding: 0.3rem;
    flex: 0 0 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .history .frame {
    aspect-ratio: 16 / 7;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .history .frame img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .hist-plate {
    margin: 0;
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    color: #39ff14;
    flex: 0 0 auto;
  }
  .hist-meta {
    margin: 0;
    color: #b7c4b4;
    font-size: 0.65rem;
    flex: 0 0 auto;
  }
  footer {
    padding: 0.15rem 0.55rem 0.3rem;
    color: #7d8b7a;
    font-size: 0.65rem;
  }
</style>
</head>
<body>
<header>
  <h1>ANPR</h1>
  <p id="status" class="wait">connecting</p>
</header>
<p id="error">waiting for anpr api</p>
<main>
  <section class="live">
    <div id="live-frame" class="frame waiting">
      <img id="live-image" alt="">
      <div id="live-boxes" class="boxes"></div>
      <pre id="live-meta" class="meta-overlay hidden"></pre>
    </div>
  </section>
  <section id="history" class="history" aria-label="Plate history"></section>
</main>
<footer id="debug"></footer>
<script>
const STATS_HOLD_MS = 5000;
const HISTORY_SLOTS = 10;
const page = {
  status: document.getElementById("status"),
  error: document.getElementById("error"),
  liveFrame: document.getElementById("live-frame"),
  liveImage: document.getElementById("live-image"),
  liveBoxes: document.getElementById("live-boxes"),
  liveMeta: document.getElementById("live-meta"),
  history: document.getElementById("history"),
  debug: document.getElementById("debug"),
};

let liveToken = "";
let historyToken = "";
let lastLive = null;
let lastHistory = [];
let heldStats = null;
let heldStatsUntil = 0;
let lastMonoNs = null;
let measuredFps = null;

function tick() {
  fetch("/api/state", { cache: "no-store" })
    .then((response) => {
      if (!response.ok) {
        throw new Error("state " + response.status);
      }
      return response.json();
    })
    .then(render)
    .catch((error) => {
      page.error.hidden = false;
      page.error.textContent = "page lost the web client: " + error;
      page.status.textContent = "api down";
      page.status.className = "down";
    });
}

function render(state) {
  if (state.ok) {
    page.status.textContent = "live";
    page.status.className = "ok";
  } else if (!state.failures) {
    page.status.textContent = "connecting";
    page.status.className = "wait";
  } else {
    page.status.textContent = "api down";
    page.status.className = "down";
  }
  if (state.error) {
    page.error.hidden = false;
    page.error.textContent = state.error;
  } else {
    page.error.hidden = true;
    page.error.textContent = "";
  }
  lastHistory = state.history || [];
  renderLive(state.latest, lastHistory);
  const limit = Math.min(HISTORY_SLOTS, state.history_limit || HISTORY_SLOTS);
  renderHistory(lastHistory, limit);
  const frameId = state.latest ? state.latest.frame_id : "none";
  page.debug.textContent = [
    state.ok ? "api up" : "api down",
    state.api_socket || "",
    "frame " + frameId,
    "failures " + state.failures,
  ].join(" · ");
}

function renderLive(latest, history) {
  lastLive = latest;
  const judged = (history && history[0]) || null;
  if (!latest || !latest.image) {
    page.liveFrame.classList.add("waiting");
    page.liveImage.removeAttribute("src");
    page.liveBoxes.replaceChildren();
    liveToken = "";
    paintMeta();
    return;
  }
  page.liveFrame.classList.remove("waiting");
  if (liveToken !== String(latest.frame_id)) {
    liveToken = String(latest.frame_id);
    page.liveImage.src = latest.image;
    updateFps(latest);
  }
  const plates = latest.plates || [];
  const livePlate = plates.length ? plates[0] : null;
  // Box + judged text only on frames that report a plate rectangle.
  if (livePlate) {
    const label = (judged && judged.text) || livePlate.text || "";
    drawBoxes(page.liveBoxes, plates, latest.width, latest.height, label);
    holdStats(livePlate, latest, measuredFps);
  } else {
    page.liveBoxes.replaceChildren();
  }
  paintMeta();
}

function updateFps(latest) {
  // Prefer the backend's published-frames-per-second. The browser only polls twice a
  // second, so the gap between the frames it happens to see measures the poll rate.
  const reported = latest.fps === undefined || latest.fps === null ? NaN : Number(latest.fps);
  const mono = Number(latest.monotonic_ns);
  if (Number.isFinite(reported)) {
    measuredFps = reported;
  } else if (Number.isFinite(mono) && lastMonoNs !== null && mono > lastMonoNs) {
    const seconds = (mono - lastMonoNs) / 1e9;
    if (seconds > 0) {
      measuredFps = 1 / seconds;
    }
  }
  if (Number.isFinite(mono)) {
    lastMonoNs = mono;
  }
}

function holdStats(plate, latest, fps) {
  heldStats = {
    text: formatStats(plate, latest, fps),
  };
  heldStatsUntil = Date.now() + STATS_HOLD_MS;
}

function paintMeta() {
  if (!heldStats || Date.now() > heldStatsUntil) {
    heldStats = null;
    page.liveMeta.classList.add("hidden");
    page.liveMeta.textContent = "";
    return;
  }
  page.liveMeta.classList.remove("hidden");
  page.liveMeta.textContent = heldStats.text;
}

function formatStats(plate, latest, fps) {
  const box = plate.box || {};
  const detConf = finiteNumber(box.confidence);
  const ocrConf = minCharConfidence(plate) || finiteNumber(plate.confidence);
  const pos = numberPair(box.x, box.y);
  const size = sizePair(box.width, box.height);
  const device = runtimeLabel(latest && latest.runtime);
  const detMs = wholeMs(latest && latest.detector_ms);
  const ocrMs = wholeMs(latest && latest.reader_ms);
  const fpsText = Number.isFinite(fps) ? fps.toFixed(1) : "";
  const when = shortClock(latest && latest.time);
  const frame = sizePair(latest && latest.width, latest && latest.height);

  const blocks = [];
  blocks.push(
    "DETECTION\n"
    + "Det: " + (detConf || "—") + " | OCR: " + (ocrConf || "—") + "\n"
    + "Pos: " + (pos || "—") + " | " + (size || "—"),
  );
  blocks.push(
    "PERFORMANCE\n"
    + "Det: " + (detMs || "—") + " |  " + device + "\n"
    + "OCR: " + (ocrMs || "—") + " |  " + device + "\n"
    + "FPS: " + (fpsText || "—"),
  );
  blocks.push(
    "STREAM\n"
    + "H.264 | " + (frame || "—") + "\n"
    + (when || "—"),
  );
  return blocks.join("\n\n");
}

function runtimeLabel(value) {
  if (value === "npu") {
    return "NPU";
  }
  if (value === "cpu") {
    return "CPU";
  }
  return "NPU/CPU";
}

function minCharConfidence(plate) {
  const chars = plate && plate.characters;
  if (Array.isArray(chars) && chars.length) {
    let lowest = Number.POSITIVE_INFINITY;
    for (const item of chars) {
      const score = Number(item && item.confidence);
      if (Number.isFinite(score) && score < lowest) {
        lowest = score;
      }
    }
    if (Number.isFinite(lowest)) {
      return lowest.toFixed(2);
    }
  }
  return finiteNumber(plate && plate.confidence);
}

function finiteNumber(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(2) : "";
}

function numberPair(x, y) {
  if (!Number.isFinite(Number(x)) || !Number.isFinite(Number(y))) {
    return "";
  }
  return Number(x) + "," + Number(y);
}

function sizePair(width, height) {
  if (!Number.isFinite(Number(width)) || !Number.isFinite(Number(height))) {
    return "";
  }
  return Number(width) + "x" + Number(height);
}

function wholeMs(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) {
    return "";
  }
  return Math.round(number) + "ms";
}

function milliseconds(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) {
    return "";
  }
  return number.toFixed(1) + " ms";
}

function shortClock(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) {
    return value || "";
  }
  return date.toLocaleString(undefined, {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
  });
}

function imageDrawRect() {
  const image = page.liveImage;
  const frame = page.liveFrame;
  const frameRect = frame.getBoundingClientRect();
  const imageRect = image.getBoundingClientRect();
  if (
    !image.complete
    || !image.naturalWidth
    || !image.naturalHeight
    || imageRect.width < 1
    || imageRect.height < 1
  ) {
    return null;
  }
  return {
    offsetX: imageRect.left - frameRect.left,
    offsetY: imageRect.top - frameRect.top,
    drawW: imageRect.width,
    drawH: imageRect.height,
  };
}

function drawBoxes(layer, plates, width, height, labelText) {
  layer.replaceChildren();
  const sourceW = width || 0;
  const sourceH = height || 0;
  if (!sourceW || !sourceH || !plates.length) {
    return;
  }
  const geometry = imageDrawRect();
  const offsetX = geometry ? geometry.offsetX : 0;
  const offsetY = geometry ? geometry.offsetY : 0;
  const drawW = geometry ? geometry.drawW : sourceW;
  const drawH = geometry ? geometry.drawH : sourceH;
  let labeled = false;
  for (const plate of plates) {
    const showLabel = !labeled && labelText;
    appendBox(
      layer,
      plate,
      sourceW,
      sourceH,
      offsetX,
      offsetY,
      drawW,
      drawH,
      showLabel ? labelText : "",
    );
    if (showLabel) {
      labeled = true;
    }
  }
}

function appendBox(layer, plate, width, height, offsetX, offsetY, drawW, drawH, labelText) {
  const box = plate.box;
  if (!box || box.width <= 0 || box.height <= 0) {
    return;
  }
  const node = document.createElement("div");
  node.className = "box";
  node.style.left = offsetX + drawW * (box.x / width) + "px";
  node.style.top = offsetY + drawH * (box.y / height) + "px";
  node.style.width = drawW * (box.width / width) + "px";
  node.style.height = drawH * (box.height / height) + "px";
  node.title = labelText || plate.text || "";
  if (labelText) {
    const label = document.createElement("p");
    label.className = "box-label";
    label.textContent = labelText;
    node.appendChild(label);
  }
  layer.appendChild(node);
}

function renderHistory(items, limit) {
  const rows = (items || []).slice(0, limit);
  const token = rows.map((item) => {
    if (!item) {
      return "-";
    }
    return item.id + ":" + item.text + ":" + item.confidence + ":" + item.frame_id;
  }).join(",");
  if (token === historyToken && page.history.childElementCount === rows.length) {
    for (let index = 0; index < rows.length; index += 1) {
      const card = page.history.children[index];
      const item = rows[index];
      if (!item) {
        continue;
      }
      const image = card.querySelector("img");
      const title = card.querySelector(".hist-plate");
      const meta = card.querySelector(".hist-meta");
      if (image && item.image) {
        image.src = item.image + "?v=" + item.frame_id;
      }
      if (title) {
        title.textContent = item.text || "—";
      }
      if (meta) {
        meta.textContent = historyMeta(item);
      }
    }
    return;
  }
  historyToken = token;
  page.history.replaceChildren();
  for (const item of rows) {
    page.history.appendChild(historyCard(item));
  }
}

function historyMeta(item) {
  const box = item.box || {};
  const parts = [
    "Det " + finiteNumber(box.confidence),
    "OCR " + minCharConfidence(item),
  ];
  const detector = milliseconds(item.detector_ms);
  const reader = milliseconds(item.reader_ms);
  if (detector) {
    parts.push(detector);
  }
  if (reader) {
    parts.push(reader);
  }
  return parts.join(" · ");
}

function historyCard(item) {
  const card = document.createElement("article");
  const frame = document.createElement("div");
  frame.className = "frame";
  const image = document.createElement("img");
  image.alt = "";
  const title = document.createElement("p");
  title.className = "hist-plate";
  const meta = document.createElement("p");
  meta.className = "hist-meta";
  if (!item) {
    title.textContent = "—";
    meta.textContent = "waiting";
  } else {
    image.src = item.image + "?v=" + item.frame_id;
    image.alt = item.text || "plate";
    title.textContent = item.text || "—";
    meta.textContent = historyMeta(item);
  }
  frame.append(image);
  card.append(frame, title, meta);
  return card;
}

function redrawLive() {
  if (!lastLive || !lastLive.image) {
    return;
  }
  const plates = lastLive.plates || [];
  const livePlate = plates.length ? plates[0] : null;
  if (livePlate) {
    const judged = (lastHistory && lastHistory[0]) || null;
    const label = (judged && judged.text) || livePlate.text || "";
    drawBoxes(page.liveBoxes, plates, lastLive.width, lastLive.height, label);
  } else {
    page.liveBoxes.replaceChildren();
  }
  paintMeta();
}

page.liveImage.addEventListener("load", redrawLive);
window.addEventListener("resize", redrawLive);

tick();
setInterval(tick, 500);
setInterval(paintMeta, 250);
</script>
</body>
</html>
